# Reusable Terraform delivery pipeline for the cloud-infrastructure
# repository. Included via:
#
#   include:
#     - project: 'crud-master/code-keeper'
#       ref: main
#       file: 'ci-templates/terraform.yml'
#
# Expects protected/masked GitLab CI/CD variables: AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_REGION, TF_STATE_BUCKET and TF_IMAGE_TAG.
# CONFIRM_DESTROY is unset by default and is required only for destroy jobs.

stages:
  - init
  - validate
  - plan
  - apply_staging
  - verify_staging
  - approve_production
  - apply_production
  - verify_production
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

.terraform_image:
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  tags:
    - docker-private

.aws_credentials:
  before_script:
    - test -n "${AWS_ACCESS_KEY_ID:-}"
    - test -n "${AWS_SECRET_ACCESS_KEY:-}"
    - test -n "${AWS_REGION:-}"
    - test -n "${TF_STATE_BUCKET:-}"

.aws_cli_image:
  image:
    name: alpine:3.22.1
    entrypoint: [""]
  tags:
    - docker-private
  before_script:
    - apk add --no-cache aws-cli
    - test -n "${AWS_ACCESS_KEY_ID:-}"
    - test -n "${AWS_SECRET_ACCESS_KEY:-}"
    - test -n "${AWS_REGION:-}"

.protected_main_only:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "main"'

init_staging:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: init
  script:
    - cd environments/staging
    - terraform fmt -check -recursive ../..
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

init_production:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: init
  script:
    - cd environments/production
    - terraform fmt -check -recursive ../..
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

validate_staging:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: validate
  needs: ["init_staging"]
  script:
    - cd environments/staging
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - terraform validate

validate_production:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: validate
  needs: ["init_production"]
  script:
    - cd environments/production
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - terraform validate

plan_staging:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: plan
  needs: ["validate_staging"]
  variables:
    TF_VAR_state_bucket: "$TF_STATE_BUCKET"
  script:
    - cd environments/staging
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - test -n "${TF_IMAGE_TAG:-}"
    - terraform plan -var="image_tag=${TF_IMAGE_TAG}" -out=staging.tfplan
  artifacts:
    paths:
      - environments/staging/staging.tfplan
    expire_in: 1 day

plan_production:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: plan
  needs: ["validate_production"]
  variables:
    TF_VAR_state_bucket: "$TF_STATE_BUCKET"
  script:
    - cd environments/production
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - test -n "${TF_IMAGE_TAG:-}"
    - terraform plan -var="image_tag=${TF_IMAGE_TAG}" -out=production.tfplan
  artifacts:
    paths:
      - environments/production/production.tfplan
    expire_in: 1 day

apply_staging:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: apply_staging
  needs: ["plan_staging"]
  resource_group: terraform-staging
  environment:
    name: staging
  script:
    - cd environments/staging
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - terraform apply -auto-approve staging.tfplan

verify_staging:
  extends: [.aws_cli_image, .protected_main_only]
  stage: verify_staging
  needs: ["apply_staging"]
  environment:
    name: staging
  script:
    - CLUSTER="${STAGING_ECS_CLUSTER:-cloud-design-staging-cluster}"
    - >
      for SERVICE in inventory-app billing-app api-gateway-app rabbit-queue billing-database inventory-database; do
        STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].deployments[0].rolloutState' --output text 2>/dev/null || echo "MISSING")
        echo "$SERVICE: $STATUS"
        if [ "$STATUS" != "COMPLETED" ]; then exit 1; fi
      done

approve_production:
  image: alpine:3.22.1
  tags:
    - docker-private
  stage: approve_production
  needs: ["verify_staging"]
  extends: [.protected_main_only]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - echo "Approved for production by ${GITLAB_USER_LOGIN}"

apply_production:
  extends: [.terraform_image, .aws_credentials, .protected_main_only]
  stage: apply_production
  needs: ["approve_production", "plan_production"]
  resource_group: terraform-production
  environment:
    name: production
  script:
    - cd environments/production
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - terraform apply -auto-approve production.tfplan

verify_production:
  extends: [.aws_cli_image, .protected_main_only]
  stage: verify_production
  needs: ["apply_production"]
  environment:
    name: production
  script:
    - CLUSTER="${PRODUCTION_ECS_CLUSTER:-cloud-design-production-cluster}"
    - >
      for SERVICE in inventory-app billing-app api-gateway-app rabbit-queue billing-database inventory-database; do
        STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].deployments[0].rolloutState' --output text 2>/dev/null || echo "MISSING")
        echo "$SERVICE: $STATUS"
        if [ "$STATUS" != "COMPLETED" ]; then exit 1; fi
      done

# Never part of the normal pipeline flow: gated by both GitLab's manual-job
# mechanism and an explicit CONFIRM_DESTROY variable that must be set by
# hand at trigger time, so a stray click can't tear down an environment.
.destroy_template:
  extends: [.terraform_image, .aws_credentials]
  stage: destroy
  rules:
    - if: '$CONFIRM_DESTROY == "yes"'
      when: manual
    - when: never

destroy_staging:
  extends: [.destroy_template]
  resource_group: terraform-staging
  script:
    - cd environments/staging
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - terraform destroy -auto-approve -var="image_tag=unused"

destroy_production:
  extends: [.destroy_template]
  resource_group: terraform-production
  script:
    - cd environments/production
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"
    - terraform destroy -auto-approve -var="image_tag=unused"
