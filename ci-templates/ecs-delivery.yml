# Reusable deploy/verify stages for any of the three application
# repositories. Included alongside Developer A's build/test/scan template
# (ci-templates/python-application.yml + security.yml - not built yet,
# that's their deliverable, not this one) via:
#
#   include:
#     - project: 'crud-master/code-keeper'
#       ref: main
#       file: 'ci-templates/python-application.yml'
#     - project: 'crud-master/code-keeper'
#       ref: main
#       file: 'ci-templates/security.yml'
#     - project: 'crud-master/code-keeper'
#       ref: main
#       file: 'ci-templates/ecs-delivery.yml'
#
# Each consuming repo then defines the real jobs by extending the hidden
# templates below with its own SERVICE_NAME/CONTAINER_NAME (see
# api-gateway-app/.gitlab-ci.yml and billing-app/.gitlab-ci.yml for
# worked examples).
#
# Requires protected/masked AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_REGION and ECR_REGISTRY variables. Use environment-scoped variables
# when staging and production have different least-privilege IAM users.
#   - A job token allowlist entry so this project's CI_JOB_TOKEN is
#     accepted by code-keeper's Repository Files API - that's how
#     deploy-ecs-service.sh gets fetched at runtime; `include:` only pulls
#     in YAML job definitions, not arbitrary files from the included
#     project.

stages:
  - deploy_staging
  - verify_staging
  - approve_production
  - deploy_production
  - verify_production

variables:
  DEPLOY_SCRIPT_URL: "${CI_API_V4_URL}/projects/crud-master%2Fcode-keeper/repository/files/scripts%2Fdeploy-ecs-service.sh/raw?ref=main"

.aws_delivery:
  image:
    name: alpine:3.22.1
    entrypoint: [""]
  tags:
    - docker-private
  before_script:
    - apk add --no-cache aws-cli curl jq
    - test -n "${AWS_ACCESS_KEY_ID:-}"
    - test -n "${AWS_SECRET_ACCESS_KEY:-}"
    - test -n "${AWS_REGION:-}"
    - test -n "${ECR_REGISTRY:-}"
    - >-
      curl --silent --fail
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      "${DEPLOY_SCRIPT_URL}"
      --output /usr/local/bin/deploy-ecs-service.sh
    - chmod +x /usr/local/bin/deploy-ecs-service.sh

.protected_main_only:
  rules:
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == "main" &&
        $AWS_ACCESS_KEY_ID && $AWS_SECRET_ACCESS_KEY &&
        $AWS_REGION && $ECR_REGISTRY

.deploy_staging_template:
  extends: [.aws_delivery, .protected_main_only]
  stage: deploy_staging
  needs: ["containerize"]
  environment:
    name: staging
  resource_group: "staging-${SERVICE_NAME}"
  script:
    # The exact image built and scanned earlier in this same pipeline -
    # never rebuilt for this stage.
    - deploy-ecs-service.sh staging "${SERVICE_NAME}" "${ECR_REGISTRY}/cloud-design/${SERVICE_NAME}:${CI_COMMIT_SHA}" "${CONTAINER_NAME}"

.verify_staging_template:
  extends: [.aws_delivery, .protected_main_only]
  stage: verify_staging
  needs: ["deploy_staging"]
  environment:
    name: staging
  script:
    - >
      test "$(aws ecs describe-services --cluster cloud-design-staging-cluster --services "${SERVICE_NAME}"
      --query 'services[0].deployments[0].rolloutState' --output text)" = "COMPLETED"
    - |
      if [ -n "${SMOKE_TEST_URL:-}" ]; then
        curl --silent --fail "${SMOKE_TEST_URL}"
      fi

.approve_production_template:
  image: alpine:3.22.1
  tags:
    - docker-private
  stage: approve_production
  needs: ["verify_staging"]
  extends: [.protected_main_only]
  rules:
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == "main" &&
        $AWS_ACCESS_KEY_ID && $AWS_SECRET_ACCESS_KEY &&
        $AWS_REGION && $ECR_REGISTRY
      when: manual
  script:
    - echo "Approved for production by ${GITLAB_USER_LOGIN}"

.deploy_production_template:
  extends: [.aws_delivery, .protected_main_only]
  stage: deploy_production
  needs: ["approve_production"]
  environment:
    name: production
  resource_group: "production-${SERVICE_NAME}"
  script:
    # Same CI_COMMIT_SHA already verified in staging above - promotion,
    # not a rebuild.
    - deploy-ecs-service.sh production "${SERVICE_NAME}" "${ECR_REGISTRY}/cloud-design/${SERVICE_NAME}:${CI_COMMIT_SHA}" "${CONTAINER_NAME}"

.verify_production_template:
  extends: [.aws_delivery, .protected_main_only]
  stage: verify_production
  needs: ["deploy_production"]
  environment:
    name: production
  script:
    - >
      test "$(aws ecs describe-services --cluster cloud-design-production-cluster --services "${SERVICE_NAME}"
      --query 'services[0].deployments[0].rolloutState' --output text)" = "COMPLETED"
    - |
      if [ -n "${SMOKE_TEST_URL:-}" ]; then
        curl --silent --fail "${SMOKE_TEST_URL}"
      fi
