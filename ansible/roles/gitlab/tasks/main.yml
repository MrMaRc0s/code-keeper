---
- name: Validate required GitLab variables
  ansible.builtin.assert:
    that:
      - gitlab_initial_root_password is defined
      - gitlab_initial_root_password | length >= 12
    fail_msg: >-
      Supply gitlab_initial_root_password through an encrypted vault or a
      runtime extra variable; never commit it.
  no_log: true

- name: Verify Docker is available
  ansible.builtin.command: docker info
  changed_when: false

- name: Create GitLab base directory
  ansible.builtin.file:
    path: "{{ gitlab_base_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create GitLab-managed persistent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ gitlab_base_directory }}/config"
    - "{{ gitlab_base_directory }}/logs"
    - "{{ gitlab_base_directory }}/data"

- name: Create protected GitLab secrets directory
  ansible.builtin.file:
    path: "{{ gitlab_base_directory }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install initial root password secret
  ansible.builtin.copy:
    content: "{{ gitlab_initial_root_password }}\n"
    dest: "{{ gitlab_base_directory }}/secrets/root_password"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install GitLab Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ gitlab_base_directory }}/compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Start GitLab
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_base_directory }}"
    files:
      - compose.yml
    pull: missing
    state: present
    wait: false

- name: Wait for GitLab health endpoint
  ansible.builtin.uri:
    url: "{{ gitlab_health_url }}"
    method: GET
    return_content: true
    status_code: 200
  register: gitlab_health
  until: gitlab_health.status == 200
  retries: 90
  delay: 10
  changed_when: false
